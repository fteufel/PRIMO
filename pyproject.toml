# pyproject.toml

[build-system]
requires = ["setuptools>=61.0.0", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["primo"]

[project]
name = "primo"
version = "0.0.1"
description = ""
readme = "README.md"
classifiers = [
    "Programming Language :: Python",
    "Programming Language :: Python :: 3",
]
dependencies = [
    "torch==2.6.0",
    "torchmetrics==1.7.0",
    "lightning==2.5.1",
    "hydra-core==1.3.2",
    "fair-esm==2.0.0",
    "h5py==3.13.0",
    "pandas==2.2.3",
    "wandb",
    "scikit-learn==1.6.1",
    "scipy==1.15.2"
]
requires-python = ">=3.9"



