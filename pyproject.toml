# pyproject.toml

[build-system]
requires = ["setuptools>=61.0.0", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["pairtransformer"]

[project]
name = "primo"
version = "0.0.1"
description = ""
readme = "README.md"
authors = [{name="Felix Teufel", email="felix.teufel@bio.ku.dk"}]
classifiers = [
    "Programming Language :: Python",
    "Programming Language :: Python :: 3",
]
dependencies = [
    "torch >= 2.0.1",
    "lightning",
    "hydra-core>=1.3.1",
    "fair-esm",
    "h5py",
    "pandas",
    "wandb"

]
requires-python = ">=3.9"



